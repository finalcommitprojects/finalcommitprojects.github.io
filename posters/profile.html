<!doctype html>
<!-- WhatsApp / Instagram profile picture, 640x640: the branch "F" logo (logo.html?v=branch).
     WhatsApp crops it to a circle, so everything sits in the middle. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .pic { width: 640px; height: 640px; background: #f6f1e7 linear-gradient(to bottom, transparent 63px, rgba(74,110,170,.15) 63px, rgba(74,110,170,.15) 65px, transparent 65px) 0 0 / 100% 64px; }
  svg { display: block; }
</style>
</head>
<body>
<div class="pic" id="poster">
  <svg width="640" height="640" viewBox="0 0 100 100">
    <g fill="none" stroke="#1f2a44" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M37 76 V31 Q37 24 44 24 H60"/>
      <path d="M37 54 Q37 48 43 48 H53"/>
    </g>
    <circle cx="66" cy="24" r="6.2" fill="#f6f1e7" stroke="#1f2a44" stroke-width="4.2"/>
    <circle cx="59" cy="48" r="6.2" fill="#f6f1e7" stroke="#1f2a44" stroke-width="4.2"/>
    <circle cx="37" cy="79" r="7.4" fill="#c4362c"/>
  </svg>
</div>
</body>
</html>
